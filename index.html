<style>
:root{--bg:#fff8e9;--red:#e50914;--red2:#c90b13;--yel:#ffd34d;--ink:#211b18;--mut:#776c63;--line:#e5d9c7;--hot:#fff0bd;--hot2:#ffe39a;--green:#3d7048;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;max-width:520px;margin:0 auto;min-height:100vh;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:20;background:var(--red);padding:calc(env(safe-area-inset-top,0px) + 13px) 18px 13px;display:flex;align-items:center;gap:11px;box-shadow:0 2px 12px rgba(30,15,5,.16)}
.brand-logo{width:46px;height:46px;border-radius:7px;object-fit:cover;display:block;flex:none}
.bar h1{font:800 24px/1 'Barlow Condensed',sans-serif;color:#fff;letter-spacing:.01em;white-space:nowrap}
.bar small{display:block;margin-top:3px;font-size:9px;font-weight:700;letter-spacing:.12em;color:#ffe9c7}
nav{position:sticky;top:62px;z-index:15;display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding:10px 14px;background:#fffdf7;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(35,20,10,.06);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font:700 12px Inter,sans-serif;color:var(--ink);background:#f5ecdc;border:0;border-radius:999px;padding:9px 13px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{background:var(--red);color:#fff;font-weight:800}
main{padding:0 16px 34px}
.leg{display:flex;gap:14px;padding:13px 2px 8px;font-size:10px;font-weight:600;color:var(--mut);overflow-x:auto;white-space:nowrap}
.leg span,.tag{display:inline-flex;align-items:center;gap:4px}.leg .p{color:var(--red)}.leg .v{color:var(--green)}
svg.i{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.idx{display:flex;justify-content:space-between;align-items:center;padding:9px 2px 0;font-size:9px;font-weight:700;letter-spacing:.05em}.idx b{color:var(--red)}.idx span{color:var(--mut)}
h2{font:800 46px/.92 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:7px 0 14px}
h3{display:flex;align-items:center;gap:9px;color:var(--red);border-bottom:2px solid var(--red);padding:18px 0 8px;font:800 27px/1.02 'Barlow Condensed',sans-serif;text-transform:uppercase}
h3 i{font:700 9px Inter,sans-serif;font-style:normal;letter-spacing:.05em}
.it{padding:13px 5px 14px;border-bottom:1px solid var(--line);min-height:58px}.it.hl{background:var(--hot);margin:0 -5px;padding-left:10px;padding-right:10px;border-radius:5px}
.row{display:flex;align-items:flex-start;gap:12px;font-family:'Barlow Condensed',sans-serif;font-weight:800}.row span:first-child{flex:1;font-size:22px;line-height:1.03}.row span:last-child{font-size:23px;line-height:1;color:var(--red);white-space:nowrap}
.tag{margin-top:7px;padding:3px 6px;border-radius:3px;font-size:9px;font-weight:700}.tag.d{background:var(--yel);color:var(--ink)}.tag.p{background:#ffd8d2;color:var(--red)}.tag.v{background:#e3eedf;color:var(--green)}
.it p{margin-top:6px;font-size:11px;line-height:1.45;color:var(--mut);max-width:96%}
footer{margin-top:8px;background:var(--red);color:#fff;padding:24px 20px calc(var(--safe) + 25px)}footer div{display:flex;align-items:center;gap:10px;font:800 23px 'Barlow Condensed',sans-serif;color:var(--yel)}.footer-logo{width:43px;height:43px;border-radius:6px;object-fit:cover;display:block;flex:none}footer a{display:block;margin-top:13px;font-size:12px;font-weight:700;color:#fff;text-decoration:none}footer p{margin-top:9px;font-size:9px;line-height:1.45;color:#ffe9d1}
@media (min-width:521px){body{box-shadow:0 0 30px rgba(0,0,0,.08)}}
</style>

function ic(k){return '<svg class="i" aria-hidden="true"><use href="#'+k+'"/></svg>'}
function show(i){
  var c=D[i],h='<div class="leg"><span class="p">'+ic('p')+'Picante</span><span>'+ic('d')+'Destaque</span><span class="v">'+ic('v')+'Vegetariano</span></div>';

    h+='<h3><i>0'+(k+1)+'</i>'+s[0]+'</h3>';
    s[1].forEach(function(x){
      h+='<div class="it'+(x[4]?' hl':'')+'"><div class="row"><span>'+x[0]+'</span><span>'+x[1]+'</span></div>';

      if(x[2])h+='<p>'+x[2]+'</p>';
      h+='</div>';
    });
  });
  document.getElementById('menu').innerHTML=h;
  [].forEach.call(document.querySelectorAll('#nav button'),function(b,j){b.setAttribute('aria-selected',j===i)});
  try{history.replaceState(null,'','#'+i)}catch(e){}
}
document.getElementById('nav').innerHTML=D.map(function(c,i){return '<button role="tab" data-i="'+i+'">'+c.n+'</button>'}).join('');
